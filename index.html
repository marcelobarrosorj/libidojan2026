<script>
window.addEventListener('error', function (e) {
  var d = document.getElementById('libido-errbar');
  if (!d) {
    d = document.createElement('div');
    d.id = 'libido-errbar';
    d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;color:#fff;font:12px monospace;padding:10px;white-space:pre-wrap;z-index:99999;max-height:45%;overflow:auto';
    (document.body || document.documentElement).appendChild(d);
  }
  d.textContent += 'ERRO: ' + (e.message || '') + ' | ' + (e.filename || '') + ':' + (e.lineno || '') + '\n';
});
window.addEventListener('unhandledrejection', function (e) {
  var d = document.getElementById('libido-errbar');
  if (!d) {
    d = document.createElement('div');
    d.id = 'libido-errbar';
    d.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#7f1d1d;color:#fff;font:12px monospace;padding:10px;white-space:pre-wrap;z-index:99999;max-height:45%;overflow:auto';
    (document.body || document.documentElement).appendChild(d);
  }
  d.textContent += 'PROMISE: ' + ((e.reason && (e.reason.message || String(e.reason))) || '') + '\n';
});
</script>
